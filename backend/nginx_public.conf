# ==============================================================================
# JIBSZ TUNNELING / J1BTNL - NGINX REVERSE PROXY CONFIG (MODE 1: VPS IP PUBLIC)
# Mendengarkan di Port 80 (HTTP/WS) dan Port 443 (TLS/SSL/WSS/gRPC)
# Mendukung penuh SSH WS (/ & /ssh-ws), VLESS (/vless), VMess (/vmess),
# Trojan (/trojan), serta gRPC (vless-grpc, vmess-grpc, trojan-grpc)
# ==============================================================================

log_format jibsz_realip '$remote_addr - $http_cf_connecting_ip [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_user_agent" "$http_x_forwarded_for"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name __DOMAIN__ *.__DOMAIN__ _;

    ssl_certificate     /etc/jibsz/ssl/fullchain.pem;
    ssl_certificate_key /etc/jibsz/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    access_log /var/log/jibsz/nginx_access.log jibsz_realip;
    error_log  /var/log/jibsz/nginx_error.log warn;

    client_max_body_size 0;
    keepalive_timeout 86400s;
    proxy_buffering off;

    # ACME HTTP-01 Challenge Directory
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Dukungan endpoint /cdn-cgi/trace untuk payload split/trace langsung
    location = /cdn-cgi/trace {
        default_type text/plain;
        return 200 "fl=jibsz\nh=$host\nip=$remote_addr\nvisit_scheme=https\nhttp=http/1.1\nloc=ID\n";
    }

    # 1. SSH WebSocket Proxy (/ssh-ws)
    location ^~ /ssh-ws {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10015;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. VLESS WebSocket (/vless)
    location ^~ /vless {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. VMess WebSocket (/vmess)
    location ^~ /vmess {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. Trojan WebSocket (/trojan)
    location ^~ /trojan {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 5. VLESS gRPC (ServiceName: vless-grpc)
    location ^~ /vless-grpc {
        grpc_pass grpc://127.0.0.1:10004;
        grpc_set_header Host $host;
        grpc_set_header CF-Connecting-IP $remote_addr;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 6. VMess gRPC (ServiceName: vmess-grpc)
    location ^~ /vmess-grpc {
        grpc_pass grpc://127.0.0.1:10005;
        grpc_set_header Host $host;
        grpc_set_header CF-Connecting-IP $remote_addr;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 7. Trojan gRPC (ServiceName: trojan-grpc)
    location ^~ /trojan-grpc {
        grpc_pass grpc://127.0.0.1:10006;
        grpc_set_header Host $host;
        grpc_set_header CF-Connecting-IP $remote_addr;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 8. Root Path / (Untuk SSH WS dengan payload GET / atau GET-WSS /)
    location / {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10015;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
