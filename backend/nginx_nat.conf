# ==============================================================================
# JIBSZ TUNNELING / J1BTNL - NGINX REVERSE PROXY CONFIG (MODE 2: VPS NAT + CF TUNNEL)
# Entry Point Utama dari cloudflared: http://127.0.0.1:80 (localhost:80)
# Full Support: Bug Host / Bug SNI, Wildcard (*.domain), Early Data (?ed=2048),
#               Multi-Path (/vless, /vmess, /trojan, /ssh-ws, & Root Path /)
# ==============================================================================

log_format jibsz_realip '$remote_addr - $http_cf_connecting_ip [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_user_agent" "$http_x_forwarded_for"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:80 default_server;
    # Menerima domain utama, seluruh wildcard subdomain (*.domain), dan Bug Host SNI apa pun
    server_name __DOMAIN__ *.__DOMAIN__ _;

    # Ekstraksi IP Client Asli dari Cloudflare Tunnel (cloudflared localhost)
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    access_log /var/log/jibsz/nginx_access.log jibsz_realip;
    error_log  /var/log/jibsz/nginx_error.log warn;

    client_max_body_size 0;
    keepalive_timeout 86400s;
    proxy_buffering off;

    # 1. SSH WebSocket Proxy (/ssh-ws atau /ssh-ws/...)
    location ~* ^/ssh-ws {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10015;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. VLESS WebSocket (/vless, /vless-ws, /vless/bug.com, /vless?ed=2048)
    location ~* ^/vless(-ws)?(/.*)?$ {
        rewrite ^/vless(-ws)?(/.*)?$ /vless break;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. VMess WebSocket (/vmess, /vmess-ws, /vmess/bug.com, /vmess?ed=2048)
    location ~* ^/vmess(-ws)?(/.*)?$ {
        rewrite ^/vmess(-ws)?(/.*)?$ /vmess break;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. Trojan WebSocket (/trojan, /trojan-ws, /trojan/bug.com, /trojan?ed=2048)
    location ~* ^/trojan(-ws)?(/.*)?$ {
        rewrite ^/trojan(-ws)?(/.*)?$ /trojan break;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 5. VLESS gRPC (ServiceName: vless-grpc)
    location ^~ /vless-grpc {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 6. VMess gRPC (ServiceName: vmess-grpc)
    location ^~ /vmess-grpc {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 7. Trojan gRPC (ServiceName: trojan-grpc)
    location ^~ /trojan-grpc {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 8. Universal Bug Path / Root Fallback:
    # Menangkap payload SSH WS dengan path apa pun (/, /worryfree, /kuota-habis, GET http://bug.com/)
    location / {
        if ($http_upgrade ~* "websocket") {
            proxy_pass http://127.0.0.1:10015;
            break;
        }
        default_type application/json;
        return 200 '{"status":"online","server":"Jibsz Tunneling / J1BTNL","mode":"VPS_NAT_CLOUDFLARE_TUNNEL","sni_bug_ready":true,"telegram":"@admj1btnl"}';
    }
}
