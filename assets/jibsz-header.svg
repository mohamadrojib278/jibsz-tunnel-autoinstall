<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280" role="img" aria-label="Jibsz Tunnels Animated Header">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#140c29"/>
    </linearGradient>
    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="280" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .wave1 { animation: drift1 9s ease-in-out infinite alternate; }
    .wave2 { animation: drift2 12s ease-in-out infinite alternate; }
    .scanline { animation: scan 4.2s linear infinite; }
    .pulse { animation: pulseGlow 2.4s ease-in-out infinite; }
    .star1 { animation: twinkle 2.8s ease-in-out infinite; }
    .star2 { animation: twinkle 3.6s ease-in-out infinite 0.9s; }
    .star3 { animation: twinkle 4.1s ease-in-out infinite 1.7s; }
    .dot { animation: blink 1.4s ease-in-out infinite; }
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; letter-spacing: 6px; }
    .sub { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; font-weight: 600; letter-spacing: 1.5px; }
    @keyframes drift1 { from { transform: translateX(0px); } to { transform: translateX(-90px); } }
    @keyframes drift2 { from { transform: translateX(-70px); } to { transform: translateX(40px); } }
    @keyframes scan { 0% { transform: translateY(-20px); opacity: 0; } 20% { opacity: 0.7; } 80% { opacity: 0.7; } 100% { transform: translateY(290px); opacity: 0; } }
    @keyframes pulseGlow { 0%, 100% { opacity: 0.92; } 50% { opacity: 1; } }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.95; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  </style>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="280" fill="url(#bgGrad)"/>

    <!-- Subtle Cyber Grid -->
    <g stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1">
      <line x1="0" y1="56" x2="1200" y2="56"/>
      <line x1="0" y1="112" x2="1200" y2="112"/>
      <line x1="0" y1="168" x2="1200" y2="168"/>
      <line x1="0" y1="224" x2="1200" y2="224"/>
      <line x1="150" y1="0" x2="150" y2="280"/>
      <line x1="300" y1="0" x2="300" y2="280"/>
      <line x1="450" y1="0" x2="450" y2="280"/>
      <line x1="600" y1="0" x2="600" y2="280"/>
      <line x1="750" y1="0" x2="750" y2="280"/>
      <line x1="900" y1="0" x2="900" y2="280"/>
      <line x1="1050" y1="0" x2="1050" y2="280"/>
    </g>

    <!-- Twinkling Constellation Nodes -->
    <g fill="#00f2fe">
      <circle class="star1" cx="110" cy="48" r="2.5"/>
      <circle class="star2" cx="240" cy="88" r="2"/>
      <circle class="star3" cx="185" cy="145" r="2.2"/>
      <circle class="star2" cx="980" cy="54" r="2.5"/>
      <circle class="star1" cx="1095" cy="96" r="2.2"/>
      <circle class="star3" cx="1030" cy="155" r="2"/>
    </g>
    <g stroke="#00f2fe" stroke-opacity="0.18" stroke-width="1">
      <line x1="110" y1="48" x2="240" y2="88"/>
      <line x1="240" y1="88" x2="185" y2="145"/>
      <line x1="980" y1="54" x2="1095" y2="96"/>
      <line x1="1095" y1="96" x2="1030" y2="155"/>
    </g>

    <!-- Scanning Neon Laser Line -->
    <rect class="scanline" x="0" y="0" width="1200" height="2.5" fill="url(#scanGrad)"/>

    <!-- Animated Waves -->
    <path class="wave1" fill="url(#waveGrad1)" d="M0,215 C220,165 420,255 660,205 C900,155 1100,245 1350,200 L1350,280 L0,280 Z"/>
    <path class="wave2" fill="url(#waveGrad2)" d="M-80,235 C180,190 420,268 700,222 C960,180 1120,255 1350,220 L1350,280 L-80,280 Z"/>

    <!-- Top Pill Badge -->
    <rect x="435" y="34" width="330" height="28" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#00f2fe" stroke-opacity="0.45"/>
    <circle class="dot" cx="456" cy="48" r="4.5" fill="#10b981"/>
    <text x="470" y="53" fill="#e2e8f0" font-size="12" class="sub">J1BTNL V4.9 • VPS PUBLIC &amp; NAT CF</text>

    <!-- Main Glowing Title -->
    <text x="600" y="136" text-anchor="middle" font-size="64" fill="url(#neonText)" filter="url(#glow)" class="title pulse">JIBSZ TUNNELS</text>

    <!-- Subtitle -->
    <text x="600" y="176" text-anchor="middle" font-size="17" fill="#cbd5e1" class="sub">SSH WebSocket • VLESS • VMess • Trojan • Public Panel + Admin Login</text>

    <!-- Glowing Divider Bar -->
    <rect x="420" y="196" width="360" height="3" rx="2" fill="url(#neonText)" opacity="0.85"/>

    <!-- Outer Neon Border -->
    <rect x="1" y="1" width="1198" height="278" rx="17" fill="none" stroke="url(#neonText)" stroke-opacity="0.35" stroke-width="2"/>
  </g>
</svg>
